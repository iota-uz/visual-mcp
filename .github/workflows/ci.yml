name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the worker's actual production runtime (mcr.microsoft.com/
      # playwright:v1.62.1-noble ships Node 24), not just the package.json
      # engines floor. run_code's sandbox exposes a global WebSocket to
      # sandboxed code (packages/runtime/src/sandbox/worker-source.ts) —
      # a Node 22+ global — so testing under an older Node here would pass
      # locally on a dev machine's newer Node while silently never having
      # run against what CI claimed to cover.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Keyed on package-lock.json, not a hand-parsed playwright version: the
      # lockfile changes whenever the pinned playwright version does (see
      # packages/runtime/package.json's exact, non-caret pin), so this stays
      # correct without extracting the version in a separate step.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint / format check
        run: npx biome ci .

      # Build before typecheck: apps/worker imports @visual-canvas/runtime/* via
      # that package's `exports` map, which points at dist/* — those declaration
      # files don't exist until packages/runtime has been built. Typechecking
      # first (against a fresh checkout with no dist/ anywhere) fails with
      # spurious "cannot find module" errors that a stale local dist/ hides.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # A0.2's guarantee that the sandbox worker runs the real path-confinement
      # function (not a hand-copied string) only holds if the built dist/
      # actually contains it — this is where "must not be minified with name
      # mangling" (see src/paths/index.ts) stops being a comment and becomes
      # something that fails the build.
      - name: Verify the sandbox path guard survives the build
        run: |
          node -e "
            import('./packages/runtime/dist/sandbox/worker-source.js').then((m) => {
              const ok =
                /function normalizeCanvasPathStandalone\(/.test(m.WORKER_SOURCE) &&
                /normalizeCanvasPathStandalone\(requestedPath, mode\)/.test(m.WORKER_SOURCE);
              if (!ok) {
                console.error('GUARD MISSING FROM DIST');
                process.exit(1);
              }
              console.log('dist guard OK');
            });
          "

      # /dev/sign-in signs in without Google against a backend that has
      # DEV_AUTH_SECRET set. It is gated on `import.meta.env.DEV`, which Vite
      # folds to false — but "Vite drops it" is exactly the kind of assumption
      # that stops being true after a config change nobody connected to auth.
      - name: Verify the dev sign-in page is absent from the production bundle
        run: |
          if grep -rl 'VITE_DEV_AUTH_SECRET\|Local sign-in' apps/web/dist/assets/; then
            echo 'DEV SIGN-IN LEAKED INTO THE PRODUCTION BUNDLE'
            exit 1
          fi
          echo 'dev sign-in absent from dist — OK'

      - name: Test
        run: npm test
